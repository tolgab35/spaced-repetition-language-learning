server:
  port: 8080

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: AuthenticationFilter
              args:
                secured: false
        - id: card-service
          uri: http://card-service:8082
          predicates:
            - Path=/api/decks/**, /api/cards/**, /api/reviews/**
          filters:
            - AuthenticationFilter
        - id: gamification-leaderboard
          uri: http://gamification-service:8083
          predicates:
            - Path=/api/gamification/leaderboard
          filters:
            - name: AuthenticationFilter
              args:
                secured: false
        - id: gamification-service
          uri: http://gamification-service:8083
          predicates:
            - Path=/api/gamification/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET:c3ByaW5nLWJvb3Qtc3BhY2VkLXJlcGV0aXRpb24tc2VjcmV0LWtleS0yMDI0}
  expiration: 86400000
